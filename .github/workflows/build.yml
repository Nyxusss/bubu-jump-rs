name: build
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk cargo quad-apk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: bubu-jump-android
          path: target/android-artifacts/release/apk/*.apk

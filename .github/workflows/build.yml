name: build
on: [push, workflow_dispatch]

env:
  NDK_VERSION: "28.2.13676358"
  CQA_REV: "bdb61325ce1aecf09ed8969690f53c86c846c118"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust + target de Android
        run: |
          rustup default 1.95.0
          rustup target add aarch64-linux-android

      # guarda dependencias ya compiladas entre ejecuciones
      - uses: Swatinem/rust-cache@v2

      # guarda cargo-quad-apk para no compilarlo cada vez
      - name: Caché de cargo-quad-apk
        id: cqa
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-quad-apk
          key: cqa-${{ env.CQA_REV }}-1.95.0

      - name: Instalar cargo-quad-apk
        if: steps.cqa.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/hoklims/cargo-quad-apk --rev ${{ env.CQA_REV }} --locked cargo-quad-apk

      - name: SDK y NDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Variables del NDK
        run: |
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Ícono de la app
        run: |
          mkdir -p android_res/mipmap-xxxhdpi
          cp icon.png android_res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK
        run: cargo quad-apk build --release

      # cargo-quad-apk guarda la .so sin comprimir: se recomprime y se vuelve a firmar
      - name: Comprimir APK
        run: |
          set -e
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK=$(ls target/android-artifacts/release/apk/*.apk)
          ls -la "$APK"
          rm -rf apkx && mkdir apkx
          unzip -q "$APK" 'lib/*' -d apkx
          cp "$APK" tmp.apk
          zip -q -d tmp.apk 'lib/*' 'META-INF/*'
          (cd apkx && zip -q -9 -r ../tmp.apk lib)
          "$BT/zipalign" -P 16 -f 4 tmp.apk aligned.apk
          "$BT/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android aligned.apk
          "$BT/apksigner" verify aligned.apk
          mv aligned.apk "$APK"
          rm -rf tmp.apk aligned.apk.idsig apkx
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: bubu-jump-android
          path: target/android-artifacts/release/apk/*.apk

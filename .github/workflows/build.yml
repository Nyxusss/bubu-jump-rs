name: build
on: [push, workflow_dispatch]

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust + targets de Android
        run: |
          rustup default 1.95.0
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: SDK y NDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Variables del NDK
        run: |
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Instalar cargo-quad-apk
                run: cargo install --git https://github.com/hoklims/cargo-quad-apk --rev bdb61325ce1aecf09ed8969690f53c86c846c118 --locked cargo-quad-apk

      - name: Compilar APK
        run: cargo quad-apk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: bubu-jump-android
          path: target/android-artifacts/release/apk/*.apk

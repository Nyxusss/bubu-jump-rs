[package]
name = "bubu-jump"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bubu-jump"
path = "main.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[package.metadata.android]
package_name = "com.nyxusss.bubujump"
label = "Bubu Jump"
fullscreen = true
res = "android_res"
icon = "@mipmap/ic_launcher"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "portrait"
